# O usuário da app é o dono do banco (Flyway cria o schema), então não precisa de init script.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: validation
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: validation
spec:
  serviceName: postgres
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: validation-env, key: DATABASE_NAME } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: validation-env, key: DATABASE_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: validation-env, key: DATABASE_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
