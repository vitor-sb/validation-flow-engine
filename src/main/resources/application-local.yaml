server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?connectTimeout=10
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

app:
  security:
    api-keys:
      - key: ${API_KEY}
        tenant-id: ${API_KEY_TENANT}
        scopes: ${API_KEY_SCOPES}
